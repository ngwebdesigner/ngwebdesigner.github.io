<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FAVICON (Icona nella scheda del browser) -->
    <link rel="icon" type="image/jpeg" href="./immagini/logo.jpg">
    
    <title>NG Web Designer - Richiesta Sito Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .code-font {
        font-family: "Fira Code", monospace;
      }

      .tech-bg {
        background-color: #030712;
        background-image:
          linear-gradient(
            to right,
            rgba(99, 102, 241, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(99, 102, 241, 0.05) 1px,
            transparent 1px
          );
        background-size: 40px 40px;
      }
    </style>
  </head>
  <body
    class="tech-bg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black"
  >
    <!-- HEADER & NAVBAR -->
    <header
      class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-indigo-500/20 px-6 py-4 shadow-lg shadow-indigo-950/30"
    >
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <!-- BRAND / LOGO JPG -->
        <a href="index.html" class="flex items-center gap-3 group">
          <!-- Contenitore dell'immagine con bordo e ombra tech -->
          <div
            class="w-11 h-11 rounded-xl bg-gradient-to-tr from-indigo-600 via-cyan-500 to-emerald-400 p-0.5 shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform duration-300 overflow-hidden"
          >
            <img
              src="./immagini/logo.jpg"
              alt="NG Web Designer Logo"
              class="w-full h-full object-cover rounded-[10px]"
            />
          </div>

          <div>
            <span
              class="font-extrabold text-xl tracking-tight text-white group-hover:text-cyan-400 transition-colors duration-300"
            >
              NG Web Designer
            </span>
            <!--<span class="block text-[10px] font-mono text-indigo-400/80 uppercase tracking-widest">&lt;dev_mode&gt;</span>-->
          </div>
        </a>

        <div class="flex items-center gap-3">
          <label
            for="page-selector"
            class="text-xs font-mono text-cyan-400 hidden sm:block"
            >SELECT_PAGE:</label
          >
          <select
            id="page-selector"
            onchange="location = this.value"
            class="bg-slate-900/90 text-slate-200 font-mono text-xs px-4 py-2.5 rounded-xl border border-indigo-500/40 hover:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all duration-300 cursor-pointer shadow-inner"
          >
            <option value="index.html">Homepage</option>
            <option value="chi-sono.html">Chi Sono</option>
            <option value="preventivo.html" selected>Richiesta Sito Web</option>
          </select>
        </div>
      </div>
    </header>

    <!-- FORM PREVENTIVO INTERATTIVO -->
    <main class="max-w-2xl mx-auto px-6 py-12 flex-grow w-full">
      <div
        class="bg-slate-900/70 border border-indigo-500/30 rounded-3xl p-8 backdrop-blur-xl shadow-2xl"
      >
        <span
          class="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-2"
          >GET_IN_TOUCH</span
        >
        <h1 class="text-2xl font-bold text-white mb-2">
          Richiedi un Preventivo
        </h1>
        <p class="text-slate-400 text-sm mb-6">
          Compila i dati per ricevere una proposta personalizzata per il tuo
          progetto web.
        </p>

       <form action="https://formspree.io/f/xkjovvwq" method="POST" class="space-y-5">
    <div>
        <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Nome e Cognome *</label>
        <!-- Aggiungi l'attributo name="nome" -->
        <input type="text" name="nome" required placeholder="Mario Rossi" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300">
    </div>

    <div>
        <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Email di contatto *</label>
        <!-- Aggiungi l'attributo name="email" -->
        <input type="email" name="email" required placeholder="mario@esempio.it" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300">
    </div>

    <div>
        <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Tipologia di Progetto</label>
        <!-- Aggiungi l'attributo name="progetto" -->
        <select name="progetto" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300 cursor-pointer">
            <option value="vetrina">Sito Vetrina per Attività Locale</option>
            <option value="personal">Portfolio / Autopresentazione</option>
            <option value="e-commerce">E-Commerce / Store Online</option>
            <option value="altro">Altro / Consulenza Tech</option>
        </select>
    </div>

    <div>
        <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Dettagli del Progetto</label>
        <!-- Aggiungi l'attributo name="messaggio" -->
        <textarea name="messaggio" rows="4" placeholder="Descrivi brevemente cosa vorresti realizzare..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all duration-300"></textarea>
    </div>

    <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-bold text-sm rounded-xl transition-all duration-300 shadow-lg shadow-indigo-600/30 hover:shadow-cyan-500/50 transform hover:-translate-y-0.5 active:translate-y-0">
        Invia Richiesta ✉️
    </button>
</form>
      </div>
    </main>

    <footer
      class="border-t border-slate-900 bg-slate-950/80 text-center py-6 text-xs text-slate-500 font-mono"
    >
      © 2026 NG Web Designer • Nicusor George Alexandru
    </footer>
  </body>
</html>
